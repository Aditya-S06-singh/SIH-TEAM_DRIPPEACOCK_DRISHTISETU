name: dhristisetu_app
description: "A modern attendance and surveillance sentinel Flutter application."
publish_to: 'none'
version: 5.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # UI, Icons, Typography & Charts
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  http: ^1.2.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
